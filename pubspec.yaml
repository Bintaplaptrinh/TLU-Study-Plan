name: tlustudy_planner
description: "TLU Study Planner for TLU students"
publish_to: 'none'
version: 1.0.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  http: ^1.5.0
  dio: ^5.11.0
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  android_intent_plus: ^6.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  android_alarm_manager_plus: ^5.1.1  # For exact daily alarms
  home_widget: ^0.9.3  # For home screen widget
  intl: ^0.20.3  # For date formatting

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

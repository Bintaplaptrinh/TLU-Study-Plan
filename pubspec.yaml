name: tlustudy_planner
description: "TLU Study Planner for TLU students"
publish_to: 'none'
version: 2.2.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  http: ^1.5.0
  dio: ^5.11.0
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  android_intent_plus: ^6.1.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  android_alarm_manager_plus: ^5.1.1  # For exact daily alarms
  home_widget: ^0.9.3  # For home screen widget
  intl: ^0.20.3  # For date formatting
  material_symbols_icons: ^4.2960.0  # Google Material Symbols (rounded)
  geolocator: ^14.0.3  # Device location for the weather card
  translator: ^1.0.4+1  # On-the-fly vi/en translation
  flutter_secure_storage: ^11.0.0  # Keystore/Keychain for the login credentials
  webview_flutter: ^4.14.1  # Full-screen Google Form inside "Đơn từ"
  flutter_appauth: ^12.1.0  # OAuth 2.0 + PKCE cho hộp thư trường (Microsoft Graph)
  path_provider: ^2.1.5  # Thư mục tạm để lưu tệp đính kèm đã tải
  open_filex: ^4.7.0  # Mở tệp đính kèm bằng ứng dụng của hệ thống

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: Build & Release in Main branch

on:
  push:
    branches:
      - main # Trigger on push to main branch

# Add permissions block
permissions:
  contents: write # This is required for creating releases

jobs:
  build:
    if: "contains(github.event.head_commit.message, '[release]')"
    name: Build & Release
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3

      # Add Java 21 setup step
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Create necessary files
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/rel.jks

      # env.json bi gitignore nen phai dung lai tu GitHub Secrets. Dung
      # here-doc quoted ('JSON') de shell khong dien bien vao giua noi dung,
      # va khong echo file ra log.
      - name: Create env.json
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          TLU_MAIL_CLIENT_ID: ${{ secrets.TLU_MAIL_CLIENT_ID }}
        run: |
          python3 - <<'PY' > env.json
          import json, os
          json.dump({
              "OPENWEATHER_API_KEY": os.environ.get("OPENWEATHER_API_KEY", ""),
              "TLU_MAIL_CLIENT_ID": os.environ.get("TLU_MAIL_CLIENT_ID", ""),
          }, __import__("sys").stdout)
          PY
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Phai >= 3.44: pubspec.lock yeu cau Dart 3.12, va flutter_localizations
          # tu 3.47 moi ghim intl 0.20.3 dung nhu pubspec khai bao.
          flutter-version: '3.47.2'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
        
      - name: Build APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=env.json --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build App Bundle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build appbundle --release --dart-define-from-file=env.json --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Build iOS (No Codesign)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=env.json
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r app-release.ipa Payload
        
      # Tag phai la vX.Y.Z, lay thang tu pubspec.yaml. Chuc nang "kiem tra
      # cap nhat" trong app so tag nay voi AppInfo.version, nen mot tag khong
      # doc duoc so phien ban (kieu release_2026.09.04) se bi bo qua va sinh
      # vien khong bao gio duoc moi cap nhat. Xem
      # lib/services/update_service.dart.
      - name: Generate Release Tag
        id: tag
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "pubspec version '$VERSION' khong dung dang x.y.z" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT

      # Ten tep dinh kem cung la mot phan cua giao uoc: khi GitHub API khong
      # tra ve danh sach asset, app dung duong dan
      # .../download/<tag>/tlu-study-plan.apk lam duong lui.
      - name: Rename artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/tlu-study-plan.apk
          cp build/app/outputs/bundle/release/app-release.aab release/tlu-study-plan.aab
          cp build/ios/iphoneos/app-release.ipa release/tlu-study-plan.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: v${{ steps.tag.outputs.version }}
          files: |
            release/tlu-study-plan.apk
            release/tlu-study-plan.aab
            release/tlu-study-plan.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
